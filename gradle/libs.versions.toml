# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
junit-jupiter-engine = "6.0.1"
tesseract-version = "5.5.3-1.5.14"
opencv-version = "1.5.14"
jackson = "3.2.2"
google-cloud-storage = "2.75.0"
pdfbox = "3.0.8"
logback = "1.6.5"
papirsykemelding = "2.0.1"
jaxb-api = "2.3.0"

[libraries]
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson"}
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter-engine" }
bytedeco-tesseract = { module = "org.bytedeco:tesseract", version.ref = "tesseract-version" }
bytedeco-tesseract-platform = { module = "org.bytedeco:tesseract-platform", version.ref = "tesseract-version" }
bytedeco-javacv = { module = "org.bytedeco:javacv-platform", version.ref = "opencv-version" }
google-cloud-storage = { module = "com.google.cloud:google-cloud-storage", version.ref = "google-cloud-storage" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox"}
papirsykemelding = { module = "no.nav.helse.xml:papirsykemelding", version.ref = "papirsykemelding" }
jaxb-api = { module = "javax.xml.bind:jaxb-api", version.ref = "jaxb-api" }
# Monitoring and observability
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }




[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.0" }
