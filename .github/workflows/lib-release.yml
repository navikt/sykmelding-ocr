name: Release sykmelding-ocr libs
on:
  push:
    paths:
      - .github/workflows/lib-release.yml
      - 'lib/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.branch }}
  cancel-in-progress: true

jobs:
  should_release:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "⏭️ Skipping release because not on main branch." >> "$GITHUB_STEP_SUMMARY"
              exit 0
          fi

          body="$(git log -1 --pretty=%B | tail -n +2)"
          if echo "$body" | grep -qi 'skip release'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping release due to 'skip release' in commit message." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Proceeding with release." >> "$GITHUB_STEP_SUMMARY"
          fi

  build_and_release:
    permissions:
      id-token: write
      packages: write
      contents: write
      security-events: write
    runs-on: ubuntu-latest
    needs: should_release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 #
        with:
          languages: kotlin
          build-mode: manual

      - name: Build gradle artifacts
        run: |
          ./gradlew assemble

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:kotlin"

      - name: Test and build lib (release skipped)
        if: github.ref != 'refs/heads/main' || needs.should_release.outputs.skip != 'false'
        run: |
          echo -n "0.0.0-SNAPSHOT" > lib/version
          ./gradlew build test
      - name: Test, build and publish lib
        if: github.ref == 'refs/heads/main' && needs.should_release.outputs.skip == 'false'
        run: |
          ./scripts/next-version.sh
          ./gradlew build test
          ./scripts/create-release.sh
          ./gradlew publishAll
          ./scripts/publish-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
